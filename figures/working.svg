<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-labelledby="fig1-title fig1-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="fig1-title">One change through why-bureau</title>
  <desc id="fig1-desc">Fictional worked example; every name, model and number is a placeholder. Seven numbered steps, top to bottom. The owner locks purpose REQ-01 and signs off the run authorisation. A builder attempt at grade build fails the reserved acceptance tests with exit 1 and run record run-0040. Escalation to the senior grade changes the diagnosis. Attempt 2 passes with exit 0. A reviewer from another vendor family gives verdict-0043. The host writes the builder run record run-0042, which references that verdict. The owner approves the merge, and the failed run-0040 is kept. Steps 3, 5 and 6 carry the three acceptance legs.</desc>
  <defs>
    <marker id="fig1-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9aa19a"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="878.5" height="558.5" rx="16" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/>

  <text x="40" y="34" font-size="20" font-weight="600" fill="#1b1f1d">One change through why-bureau</text>
  <text x="840" y="34" font-size="14" fill="#6b726c" text-anchor="end">Fictional linecount example, REQ-01</text>

  <text x="40" y="58" font-size="14" font-weight="600" fill="#3d453f">three acceptance legs:</text>
  <text x="186" y="58" font-size="14" fill="#3d453f">leg 1 host-written run record, leg 2 reserved acceptance, leg 3 independent reviewer</text>

  <rect x="72" y="72" width="628" height="68" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="93" font-size="15" font-weight="600" fill="#1b1f1d">Owner locks purpose REQ-01 and signs the run authorisation</text>
  <text x="92" y="111" font-size="14" fill="#3d453f">Goal: add --exclude PATTERN, which skips files whose path matches.</text>
  <text x="92" y="129" font-size="14" fill="#3d453f">Writable paths src/linecount/ and tests/dev/; budget 12 USD; expires in five days.</text>

  <rect x="72" y="154" width="628" height="50" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="175" font-size="15" font-weight="600" fill="#1b1f1d">Builder role, grade build, attempt 1</text>
  <text x="92" y="193" font-size="14" fill="#3d453f">Host entry check passes; the dispatcher proposes model-a and the host accepts.</text>

  <rect x="72" y="218" width="628" height="50" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="239" font-size="15" font-weight="600" fill="#1b1f1d">Host runs the reserved acceptance tests: exit 1, failed</text>
  <text x="92" y="257" font-size="14" fill="#3d453f">Run record run-0040: failed. The worker’s “done” stays a claim.</text>

  <rect x="72" y="282" width="628" height="50" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="303" font-size="15" font-weight="600" fill="#1b1f1d">Escalation to the senior grade, with a changed diagnosis</text>
  <text x="92" y="321" font-size="14" fill="#3d453f">The pattern matched the file name instead of the full path. No extra permissions.</text>

  <rect x="72" y="346" width="628" height="50" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="367" font-size="15" font-weight="600" fill="#1b1f1d">Builder attempt 2 at the builder role’s own grade</text>
  <text x="92" y="385" font-size="14" fill="#3d453f">Host runs the reserved acceptance tests: exit 0, passed.</text>

  <rect x="72" y="410" width="628" height="68" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="431" font-size="15" font-weight="600" fill="#1b1f1d">Reviewer from another vendor family, in a session of its own</text>
  <text x="92" y="449" font-size="14" fill="#3d453f">Verdict-0043, tied to the candidate digest and the acceptance digest.</text>
  <text x="92" y="467" font-size="14" fill="#3d453f">Host-written run record run-0042.</text>

  <rect x="72" y="492" width="628" height="50" rx="10" fill="#f7f7f4" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="92" y="513" font-size="15" font-weight="600" fill="#1b1f1d">Owner approves the merge into protected main (safeguard S2)</text>
  <text x="92" y="531" font-size="14" fill="#3d453f">The failed run-0040 and its evidence are kept.</text>

  <circle cx="53" cy="106" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="111" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">1</text>
  <line x1="53" y1="120" x2="53" y2="164" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="179" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="184" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">2</text>
  <line x1="53" y1="193" x2="53" y2="228" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="243" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="248" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">3</text>
  <line x1="53" y1="257" x2="53" y2="292" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="307" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="312" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">4</text>
  <line x1="53" y1="321" x2="53" y2="356" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="371" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="376" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">5</text>
  <line x1="53" y1="385" x2="53" y2="429" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="444" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="449" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">6</text>
  <line x1="53" y1="458" x2="53" y2="502" stroke="#9aa19a" stroke-width="1.5" marker-end="url(#fig1-arrow)"/>

  <circle cx="53" cy="517" r="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="53" y="522" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">7</text>

  <line x1="700" y1="243" x2="710" y2="243" stroke="#b9bdb6" stroke-width="1.5"/>
  <rect x="712" y="230" width="132" height="26" rx="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="778" y="248" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">leg 1, leg 2</text>

  <line x1="700" y1="371" x2="710" y2="371" stroke="#b9bdb6" stroke-width="1.5"/>
  <rect x="712" y="358" width="132" height="26" rx="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="778" y="376" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">leg 2</text>

  <line x1="700" y1="444" x2="710" y2="444" stroke="#b9bdb6" stroke-width="1.5"/>
  <rect x="712" y="431" width="132" height="26" rx="13" fill="#eef0ea" stroke="#b9bdb6" stroke-width="1.5"/>
  <text x="778" y="449" font-size="14" font-weight="600" fill="#3d453f" text-anchor="middle">leg 3</text>
</svg>
